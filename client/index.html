<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Favicon e Ícones -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Meta Tags Básicas -->
    <meta name="theme-color" content="#F59E0B" />
    <title>AppObras - Sistema de Gestão de Obras e Construções</title>
    <meta name="description" content="AppObras é o sistema completo para gestão de obras, reformas e construções. Controle ordens de serviço, orçamentos, equipes, diário de obra, medições e relatórios em uma única plataforma." />
    <meta name="keywords" content="gestão de obras, sistema de construção, controle de obras, orçamento de obra, diário de obra, medições, construção civil, reformas, engenharia civil, gerenciamento de projetos, cronograma de obra, mão de obra, fornecedores, AppObras" />
    <meta name="author" content="AppObras" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://appobras.com.br/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://appobras.com.br/" />
    <meta property="og:title" content="AppObras - Sistema de Gestão de Obras e Construções" />
    <meta property="og:description" content="Sistema completo para gestão de obras, reformas e construções. Controle orçamentos, equipes, diário de obra, medições e relatórios em uma única plataforma." />
    <meta property="og:image" content="https://appobras.com.br/logo-appobras.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="AppObras" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://appobras.com.br/" />
    <meta name="twitter:title" content="AppObras - Sistema de Gestão de Obras e Construções" />
    <meta name="twitter:description" content="Sistema completo para gestão de obras, reformas e construções. Controle orçamentos, equipes, diário de obra, medições e relatórios." />
    <meta name="twitter:image" content="https://appobras.com.br/logo-appobras.png" />
    
    <!-- Dados Estruturados JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AppObras",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Sistema completo de gestão de obras, reformas e construções. Controle ordens de serviço, orçamentos, equipes, diário de obra, medições e relatórios.",
      "url": "https://appobras.com.br",
      "image": "https://appobras.com.br/logo-appobras.png",
      "author": {
        "@type": "Organization",
        "name": "AppObras"
      },
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "BRL",
        "lowPrice": "99",
        "highPrice": "399",
        "offerCount": "3"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      },
      "featureList": [
        "Gestão de Ordens de Serviço",
        "Controle de Orçamentos",
        "Diário de Obra Digital",
        "Medições e Avanço Físico-Financeiro",
        "Gestão de Equipes e Mão de Obra",
        "Controle de Fornecedores",
        "Galeria de Fotos e Timeline",
        "Mapa de Obras com GPS",
        "Relatórios Detalhados"
      ]
    }
    </script>
    
    <!-- Dados Estruturados - Organização -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AppObras",
      "url": "https://appobras.com.br",
      "logo": "https://appobras.com.br/logo-appobras.png",
      "description": "Sistema de gestão de obras, reformas e construções",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "Portuguese"
      },
      "sameAs": []
    }
    </script>
    
    <!-- Preconnect para Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
